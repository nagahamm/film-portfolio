# ==========================================================
# Netlify — メイン設定
# ==========================================================

[build]
  # ビルド工程を持たない静的サイト。リポジトリ直下をそのまま公開する
  publish = "."
  command = ""

# ----------------------------------------------------------
# 動画配信（Cloudflare R2）
#
# assets/videos/ 配下の動画は全てリポジトリに同梱せず、実体を
# Cloudflare R2 に置き、同じパスへのリクエストを 302 で振り向ける。
# index.html 側は assets/videos/... の相対パスのままでよく、
# 配信元を変えるときもこのファイルの CLOUDFLARE_BASE だけを直せば済む。
# ----------------------------------------------------------

[[redirects]]
  from = "/assets/videos/2026-02-22__cam_01__test.mp4"
  to = "https://pub-c06ba1f5759240e590e6e1f828a5ee2f.r2.dev/2026-02-22__cam_01__test.mp4"
  status = 302
  force = true

