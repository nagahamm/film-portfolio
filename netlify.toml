# ----------------------------------------------------------
# キャッシュ
# 画像・動画・PDF はファイル名に撮影日と用途を含む運用のため、
# 内容が変わるときはファイル名も変わる前提で長期キャッシュする。
# ----------------------------------------------------------

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
