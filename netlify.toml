# ==========================================================
# Netlify — メイン設定
# ==========================================================

[build]
  # 公開するのは手元で書き出した site/ だけ(scripts/publish.sh が netlify deploy --dir=site で送る)。
  # Netlify 側ではビルドしない。リポジトリ直下はテーマのソースで、公開するものではない
  publish = "site"
  command = ""

# ----------------------------------------------------------
# メディア配信（Cloudflare R2）
#
# 画像・PDF・動画はリポジトリに同梱せず、実体を Cloudflare R2 に置き、
# 次のパスへのリクエストを同じ相対パスのまま 302 で振り向ける。
#   /assets/videos/*          → R2 videos/
#   /wp-content/uploads/*     → R2 uploads/
# 作品ごとのファイルは <作品の slug>/ に置くため、足してもこのファイルは変えない。
# R2 へのアップロード漏れは scripts/check.mjs が検出する。
# ----------------------------------------------------------

[[redirects]]
  from = "/assets/videos/*"
  to = "https://pub-c06ba1f5759240e590e6e1f828a5ee2f.r2.dev/videos/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/wp-content/uploads/*"
  to = "https://pub-c06ba1f5759240e590e6e1f828a5ee2f.r2.dev/uploads/:splat"
  status = 302
  force = true

# ----------------------------------------------------------
# キャッシュ
# 画像・動画・PDF はファイル名に撮影日と用途を含む運用のため、
# 内容が変わるときはファイル名も変わる前提で長期キャッシュする。
# ----------------------------------------------------------

[[headers]]
  for = "/wp-content/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/wp-content/themes/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
